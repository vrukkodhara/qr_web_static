<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Check-in System</title>
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: #666;
        }

        /* Registration Section */
        .registration-section {
            background: #f8faff;
            border: 1px solid #e0e8f7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .registration-title {
            font-size: 13px;
            font-weight: 700;
            color: #333;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e0e8f7;
            background: white;
            color: #666;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"] {
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-register,
        .btn-login {
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-register:hover,
        .btn-login:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .btn-register:disabled,
        .btn-login:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Client Info */
        .client-info {
            background: #ecf5e9;
            border: 1px solid #81c784;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }

        .client-info.show {
            display: block;
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .info-header .title {
            font-size: 13px;
            font-weight: 700;
            color: #2e7d32;
        }

        .info-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 12px;
        }

        .btn-logout {
            padding: 8px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-logout:hover {
            background: #c82333;
        }

        /* Scanner Section */
        .scanner-section {
            margin-bottom: 24px;
        }

        video {
            width: 100%;
            border-radius: 12px;
            background: #f0f0f0;
            display: block;
            margin-bottom: 14px;
        }

        .control-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-primary,
        .btn-secondary {
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-secondary:disabled {
            background: #e8e8e8;
            cursor: not-allowed;
        }

        .manual-input {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        input[type="text"].qr-field {
            padding: 11px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
        }

        /* Luggage Input Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .luggage-modal {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .modal-subheader {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .pilgrim-preview {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .preview-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .preview-row:last-child {
            border-bottom: none;
        }

        .preview-label {
            font-weight: 600;
            color: #495057;
        }

        .preview-value {
            color: #212529;
        }

        .luggage-input-group {
            margin-bottom: 20px;
        }

        .luggage-label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .luggage-input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
            font-weight: 700;
            transition: all 0.3s;
        }

        .luggage-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .quick-select {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .quick-btn {
            padding: 10px;
            background: #f0f0f0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-cancel {
            padding: 12px;
            background: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .btn-confirm {
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-confirm:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-confirm:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Status Card */
        .status-card {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
            border-left: 4px solid;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-success {
            background: #d4edda;
            border-left-color: #28a745;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            border-left-color: #dc3545;
            color: #721c24;
        }

        .status-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .status-details {
            font-size: 12px;
            line-height: 1.6;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
        }

        .detail-value {
            font-weight: 500;
            text-align: right;
        }

        /* History */
        .history {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }

        .history-title {
            font-size: 14px;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
        }

        .history-item {
            padding: 10px 12px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 12px;
            border-left: 3px solid #667eea;
        }

        .history-item.error {
            border-left-color: #dc3545;
            background: #fff5f5;
        }

        .history-time {
            color: #999;
            font-size: 11px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Amartithi Pilgrims</h1>
            <h4>📱 QR Check-in</h4>
        </div>

        <!-- Registration Section -->
        <div class="registration-section">
            <div class="registration-title">👤 Staff Access</div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" id="registerTab">Register</button>
                <button class="tab-btn" id="loginTab">Login</button>
            </div>

            <!-- Register Form -->
            <div id="registerForm">
                <div class="form-group">
                    <input type="text" id="regClientId" placeholder="Staff ID (e.g., staff1)">
                    <input type="password" id="regPassword" placeholder="Password">
                </div>
                <div class="form-row full">
                    <input type="text" id="regBuilding" placeholder="Tent Assignment">
                </div>
                <div class="form-row">
                    <button class="btn-register" id="registerBtn">Register</button>
                    <button class="btn-secondary" style="cursor: pointer;" onclick="document.getElementById('loginTab').click()">Have Account?</button>
                </div>
            </div>

            <!-- Login Form -->
            <div id="loginForm" style="display: none;">
                <div class="form-group">
                    <input type="text" id="loginClientId" placeholder="Staff ID">
                    <input type="password" id="loginPassword" placeholder="Password">
                </div>
                <div class="form-row">
                    <button class="btn-login" id="loginBtn">Login</button>
                    <button class="btn-secondary" style="cursor: pointer;" onclick="document.getElementById('registerTab').click()">New User?</button>
                </div>
            </div>
        </div>

        <!-- Client Info Display -->
        <div class="client-info" id="clientInfo">
            <div class="info-header">
                <span class="title">✓ Logged in as</span>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
            <div class="info-label">Volunteer ID</div>
            <div class="info-value" id="displayClientId"></div>
            <div class="info-label">Assigned Tent</div>
            <div class="info-value" id="displayBatch"></div>
        </div>

        <!-- Scanner Section -->
        <div class="scanner-section">
            <video id="video" playsinline></video>
            <div class="control-buttons">
                <button class="btn-primary" id="startBtn">Start Camera</button>
                <button class="btn-secondary" id="stopBtn">Stop Camera</button>
            </div>

            <div class="manual-input">
                <input type="text" id="qrInput" class="qr-field" placeholder="Or paste QR code...">
                <button class="btn-primary" id="submitBtn" style="min-width: 80px;">Submit</button>
            </div>
        </div>

        <!-- Status Card -->
        <div class="status-card" id="statusCard">
            <div class="status-title" id="statusTitle"></div>
            <div class="status-details" id="statusDetails"></div>
        </div>

        <!-- History -->
        <div class="history" id="historySection">
            <div class="history-title">Recent Scans</div>
            <div id="historyList"></div>
        </div>
    </div>

    <!-- Luggage Input Modal -->
    <div class="modal-overlay" id="luggageModal">
        <div class="luggage-modal">
            <div class="modal-header">🧳 Luggage Count</div>
            <div class="modal-subheader">Enter the number of luggage items for this pilgrim</div>
            
            <div class="pilgrim-preview" id="pilgrimPreview"></div>
            
            <div class="luggage-input-group">
                <label class="luggage-label">Number of Luggage Items</label>
                <input type="number" id="luggageInput" class="luggage-input" min="0" max="99" value="0" placeholder="0">
                <div class="quick-select">
                    <button class="quick-btn" onclick="setLuggage(0)">0</button>
                    <button class="quick-btn" onclick="setLuggage(1)">1</button>
                    <button class="quick-btn" onclick="setLuggage(2)">2</button>
                    <button class="quick-btn" onclick="setLuggage(3)">3</button>
                    <button class="quick-btn" onclick="setLuggage(4)">4</button>
                    <button class="quick-btn" onclick="setLuggage(5)">5</button>
                    <button class="quick-btn" onclick="setLuggage(10)">10</button>
                    <button class="quick-btn" onclick="setLuggage(15)">15</button>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" id="cancelLuggage">Cancel</button>
                <button class="btn-confirm" id="confirmLuggage">Check In</button>
            </div>
        </div>
    </div>

    <script>
        const getAPIUrl = () => {
            const hostname = window.location.hostname;
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                return 'http://localhost:5000';
            }
            return window.location.origin;
        };
        //const API_URL = getAPIUrl();
        const API_URL = 'https://qr-scanner-7rub.onrender.com';
        console.log('Using API URL:', API_URL);

        const video = document.getElementById("video");
        const canvas = document.createElement("canvas");
        const canvasContext = canvas.getContext("2d");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const submitBtn = document.getElementById("submitBtn");
        const qrInput = document.getElementById("qrInput");
        const statusCard = document.getElementById("statusCard");
        const historyList = document.getElementById("historyList");

        // Auth tabs
        const registerTab = document.getElementById("registerTab");
        const loginTab = document.getElementById("loginTab");
        const registerForm = document.getElementById("registerForm");
        const loginForm = document.getElementById("loginForm");

        // Registration elements
        const regClientId = document.getElementById("regClientId");
        const regPassword = document.getElementById("regPassword");
        const regBuilding = document.getElementById("regBuilding");
        const registerBtn = document.getElementById("registerBtn");

        // Login elements
        const loginClientId = document.getElementById("loginClientId");
        const loginPassword = document.getElementById("loginPassword");
        const loginBtn = document.getElementById("loginBtn");

        // Info display
        const clientInfo = document.getElementById("clientInfo");
        const displayClientId = document.getElementById("displayClientId");
        const displayBatch = document.getElementById("displayBatch");
        const logoutBtn = document.getElementById("logoutBtn");

        // Luggage modal
        const luggageModal = document.getElementById("luggageModal");
        const pilgrimPreview = document.getElementById("pilgrimPreview");
        const luggageInput = document.getElementById("luggageInput");
        const cancelLuggage = document.getElementById("cancelLuggage");
        const confirmLuggage = document.getElementById("confirmLuggage");

        let scanning = false;
        let sessionToken = sessionStorage.getItem("sessionToken") || null;
        let currentClientId = null;
        let currentBuilding = null;
        let pendingQRData = null; // Store QR data while waiting for luggage input
        let verifiedPilgrimData = null; // Store verified pilgrim data

        // Helper function to set luggage count
        window.setLuggage = function(count) {
            luggageInput.value = count;
            luggageInput.focus();
        };

        // Tab switching
        registerTab.addEventListener("click", () => {
            registerForm.style.display = "block";
            loginForm.style.display = "none";
            registerTab.classList.add("active");
            loginTab.classList.remove("active");
        });

        loginTab.addEventListener("click", () => {
            loginForm.style.display = "block";
            registerForm.style.display = "none";
            loginTab.classList.add("active");
            registerTab.classList.remove("active");
        });

        // Register
        registerBtn.addEventListener("click", async () => {
            const clientId = regClientId.value.trim();
            const password = regPassword.value.trim();
            const building = regBuilding.value.trim();

            if (!clientId || !password || !building) {
                alert("Please fill all fields");
                return;
            }

            registerBtn.disabled = true;
            try {
                const response = await fetch(`${API_URL}/api/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ client_id: clientId, password, building })
                });

                const result = await response.json();
                if (result.status === "success") {
                    regClientId.value = regPassword.value = regBuilding.value = "";
                    alert("✓ Registration successful! Please login.");
                    loginTab.click();
                } else {
                    alert("✗ " + result.message);
                }
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                registerBtn.disabled = false;
            }
        });

        // Login
        loginBtn.addEventListener("click", async () => {
            const clientId = loginClientId.value.trim();
            const password = loginPassword.value.trim();

            if (!clientId || !password) {
                alert("Please enter credentials");
                return;
            }

            loginBtn.disabled = true;
            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ client_id: clientId, password })
                });

                const result = await response.json();
                if (result.success === true) {
                    sessionToken = result.session_token;
                    sessionStorage.setItem("sessionToken", sessionToken);
                    
                    currentClientId = result.client_id;
                    currentBuilding = result.building;
                    
                    loginClientId.value = loginPassword.value = "";
                    displayClientInfo();
                    disableScannerSection(false);
                    alert("✓ Login successful!");
                } else {
                    alert("✗ " + (result.message || "Login failed"));
                }
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                loginBtn.disabled = false;
            }
        });

        function displayClientInfo() {
            displayClientId.textContent = currentClientId;
            displayBatch.textContent = currentBuilding;
            clientInfo.classList.add("show");
        }

        logoutBtn.addEventListener("click", async () => {
            try {
                if (sessionToken) {
                    await fetch(`${API_URL}/api/logout`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ session_token: sessionToken })
                    });
                }
            } catch (error) {
                console.error("Logout error:", error);
            }
            
            sessionToken = null;
            currentClientId = null;
            currentBuilding = null;
            sessionStorage.removeItem("sessionToken");
            
            clientInfo.classList.remove("show");
            disableScannerSection(true);
            stopBtn.click();
        });

        function disableScannerSection(disabled) {
            startBtn.disabled = stopBtn.disabled = submitBtn.disabled = qrInput.disabled = disabled;
        }

        async function verifySession() {
            if (!sessionToken) {
                return false;
            }

            try {
                const response = await fetch(`${API_URL}/api/verify-session`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_token: sessionToken })
                });

                const result = await response.json();
                if (result.success) {
                    currentClientId = result.client_id;
                    currentBuilding = result.building;
                    displayClientInfo();
                    disableScannerSection(false);
                    return true;
                } else {
                    sessionToken = null;
                    sessionStorage.removeItem("sessionToken");
                    return false;
                }
            } catch (error) {
                console.error("Session verification error:", error);
                return false;
            }
        }

        startBtn.addEventListener("click", async () => {
            if (!sessionToken) {
                alert("Please login first");
                return;
            }

            try {
                let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                    .catch(() => navigator.mediaDevices.getUserMedia({ video: true }));

                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play().then(() => {
                        scanning = true;
                        startBtn.disabled = true;
                        stopBtn.disabled = false;
                        scanQRCode();
                    });
                };
            } catch (error) {
                alert("Camera error: " + error.message);
            }
        });

        stopBtn.addEventListener("click", () => {
            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());
            scanning = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
        });

        submitBtn.addEventListener("click", () => {
            if (!sessionToken) {
                alert("Please login first");
                return;
            }
            const data = qrInput.value.trim();
            if (data) {
                verifyPilgrim(data);
                qrInput.value = "";
            }
        });

        qrInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") submitBtn.click();
        });

        function scanQRCode() {
            if (!scanning) return;
            if (typeof jsQR === 'undefined') {
                setTimeout(scanQRCode, 100);
                return;
            }

            try {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvasContext.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, canvas.width, canvas.height, { inversionAttempts: "dontInvert" });

                    if (code) {
                        scanning = false;
                        verifyPilgrim(code.data);
                        stopBtn.click();
                        return;
                    }
                }
            } catch (e) {
                console.error("Scan error:", e);
            }

            requestAnimationFrame(scanQRCode);
        }

        // Step 1: Verify pilgrim and show luggage input modal
        async function verifyPilgrim(qrData) {
            try {
                statusCard.style.display = "none";
                const response = await fetch(`${API_URL}/api/verify-pilgrim`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ qr_data: qrData, session_token: sessionToken })
                });

                const result = await response.json();
                
                // Check if session expired
                if (result.code === 401) {
                    alert("Session expired. Please login again.");
                    logoutBtn.click();
                    return;
                }

                if (!result.success) {
                    // Show error immediately (building mismatch, pilgrim not found, etc.)
                    addToHistory(result, false);
                    displayStatus(result, false);
                    return;
                }

                // Success - store data and show luggage modal
                pendingQRData = qrData;
                verifiedPilgrimData = result;
                showLuggageModal(result);

            } catch (error) {
                const errorResult = { message: "Network error: " + error.message };
                addToHistory(errorResult, false);
                displayStatus(errorResult, false);
            }
        }

        // Show luggage input modal with pilgrim details
        function showLuggageModal(pilgrimData) {
            // Display pilgrim preview
            pilgrimPreview.innerHTML = `
                <div class="preview-row">
                    <span class="preview-label">Group Head</span>
                    <span class="preview-value">${pilgrimData.group_head_name}</span>
                </div>
                <div class="preview-row">
                    <span class="preview-label">Token #</span>
                    <span class="preview-value">${pilgrimData.token}</span>
                </div>
                <div class="preview-row">
                    <span class="preview-label">Tent Men</span>
                    <span class="preview-value">${pilgrimData.tent_men || 'N/A'}</span>
                </div>
                <div class="preview-row">
                    <span class="preview-label">Tent Women</span>
                    <span class="preview-value">${pilgrimData.tent_women || 'N/A'}</span>
                </div>
                <div class="preview-row">
                    <span class="preview-label">Building</span>
                    <span class="preview-value">${pilgrimData.building}</span>
                </div>
            `;

            // Reset and show modal
            luggageInput.value = 0;
            luggageModal.classList.add("show");
            luggageInput.focus();
        }

        // Cancel luggage input
        cancelLuggage.addEventListener("click", () => {
            luggageModal.classList.remove("show");
            pendingQRData = null;
            verifiedPilgrimData = null;
        });

        // Step 2: Complete check-in with luggage count
        confirmLuggage.addEventListener("click", async () => {
            const luggageCount = parseInt(luggageInput.value) || 0;

            if (luggageCount < 0) {
                alert("Luggage count cannot be negative");
                return;
            }

            confirmLuggage.disabled = true;
            
            try {
                const response = await fetch(`${API_URL}/api/complete-checkin`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        qr_data: pendingQRData, 
                        session_token: sessionToken,
                        luggage_count: luggageCount
                    })
                });

                const result = await response.json();
                
                // Close modal
                luggageModal.classList.remove("show");
                
                // Check if session expired
                if (result.code === 401) {
                    alert("Session expired. Please login again.");
                    logoutBtn.click();
                    return;
                }
                
                addToHistory(result, response.ok);
                displayStatus(result, response.ok);

                // Clear pending data
                pendingQRData = null;
                verifiedPilgrimData = null;

            } catch (error) {
                luggageModal.classList.remove("show");
                const errorResult = { message: "Network error: " + error.message };
                addToHistory(errorResult, false);
                displayStatus(errorResult, false);
            } finally {
                confirmLuggage.disabled = false;
            }
        });

        // Allow Enter key to confirm
        luggageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                confirmLuggage.click();
            }
        });

        function getStatusFromMessage(message) {
            return !message ? "UNKNOWN" : message.toLowerCase().includes("out") ? "CHECKED OUT" : "CHECKED IN";
        }

        function displayStatus(result, success) {
            const statusTitle = document.getElementById("statusTitle");
            const statusDetails = document.getElementById("statusDetails");

            statusCard.classList.remove("status-success", "status-error");

            if (success) {
                const status = getStatusFromMessage(result.message);
                statusCard.classList.add("status-success");
                statusTitle.textContent = `✓ ${status}`;
                statusDetails.innerHTML = `
                    <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${status}</span></div>
                    <div class="detail-row"><span class="detail-label">Group Head</span><span class="detail-value">${result.group_head_name}</span></div>
                    <div class="detail-row"><span class="detail-label">Token #</span><span class="detail-value">${result.token}</span></div>
                    <div class="detail-row"><span class="detail-label">Total Men</span><span class="detail-value">${result.tent_men || 'N/A'}</span></div>
                    <div class="detail-row"><span class="detail-label">Total Women</span><span class="detail-value">${result.tent_women || 'N/A'}</span></div>
                    <div class="detail-row"><span class="detail-label">Assigned Tent</span><span class="detail-value">${result.building}</span></div>
                    <div class="detail-row"><span class="detail-label">Luggage Count</span><span class="detail-value" style="font-weight: 700; color: #28a745;">${result.luggage}</span></div>
                    <div class="detail-row"><span class="detail-label">Time</span><span class="detail-value">${result.timestamp}</span></div>
                `;
            } else {
                statusCard.classList.add("status-error");
                statusTitle.textContent = "✗ " + result.message;
                if (result.correct_building && result.client_building) {
                    statusDetails.innerHTML = `
                        <div class="detail-row"><span class="detail-label">Pilgrim</span><span class="detail-value">${result.pilgrim.name}</span></div>
                        <div class="detail-row"><span class="detail-label">Token #</span><span class="detail-value">${result.pilgrim.id}</span></div>
                        <div class="detail-row"><span class="detail-label">Assigned Location</span><span class="detail-value" style="font-weight: 700; color: #c82333;">${result.correct_building}</span></div>
                        <div class="detail-row"><span class="detail-label">Men's Tent</span><span class="detail-value">${result.tent_men || 'N/A'}</span></div>
                        <div class="detail-row"><span class="detail-label">Women's Tent</span><span class="detail-value">${result.tent_women || 'N/A'}</span></div>
                        <div style="margin-top: 10px; padding: 10px; background: rgba(255,0,0,0.15); border-radius: 4px; text-align: center;">
                            <strong style="color: #c82333;">Guide pilgrim to ${result.correct_building} Tent ${result.tent_men} for Men and Tent ${result.tent_women} for Women</strong>
                        </div>
                    `;
                } else {
                    statusDetails.innerHTML = `<div>${result.message}</div>`;
                }
            }

            statusCard.style.display = "block";
        }

        function addToHistory(result, success) {
            const time = new Date().toLocaleTimeString();
            const item = document.createElement("div");
            item.className = "history-item" + (success ? "" : " error");
            const status = getStatusFromMessage(result.message);
            const luggageInfo = result.luggage !== undefined ? ` (${result.luggage} luggage)` : '';
            item.innerHTML = `
                <div>${success ? '✓ ' + status + luggageInfo : '✗ ' + result.message}</div>
                <div class="history-time">${time}</div>
            `;
            historyList.insertBefore(item, historyList.firstChild);
            while (historyList.children.length > 10) historyList.removeChild(historyList.lastChild);
        }

        async function initializeApp() {
            const hasSession = await verifySession();
            
            if (!hasSession) {
                clientInfo.classList.remove("show");
                disableScannerSection(true);
            }
        }

        initializeApp();
        stopBtn.disabled = true;

        setTimeout(() => {
            if (typeof jsQR === 'undefined') {
                console.error("jsQR library failed to load");
            }
        }, 2000);
    </script>
</body>
</html>
